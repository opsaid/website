<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>OPSaid Documentation</title>
  <script>
    (() => {
      const saved = localStorage.getItem("opsaid-language");
      const browser = navigator.languages?.[0] || navigator.language || "en";
      const language = saved || (/^zh(?:-|$)/i.test(browser) ? "zh-cn" : "en");
      location.replace("/docs/" + (language === "zh-cn" ? "zh-cn" : "en") + "/" + location.search + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
